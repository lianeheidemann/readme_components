<svg xmlns="http://www.w3.org/2000/svg" width="220" height="38" viewBox="0 0 220 38" role="img" aria-labelledby="title desc">
  <title id="title">Under construction</title>
  <desc id="desc">Lavender badge with softly animated bubbles and three dots appearing one at a time.</desc>

  <defs>
    <linearGradient id="badge-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9FD"/>
      <stop offset="0.55" stop-color="#F3E8FD"/>
      <stop offset="1" stop-color="#E7DDFC"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCCFF7"/>
      <stop offset="1" stop-color="#8B5FD3"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#8B5FD3" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="218" height="36" rx="18"
        fill="url(#badge-bg)" stroke="#B99AE9" stroke-width="1.5" filter="url(#soft-shadow)"/>

  <g aria-hidden="true">
    <circle cx="18" cy="20" r="5.5" fill="url(#bubble)" opacity="0.9">
      <animate attributeName="r" values="5;6;5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.72;1;0.72" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="27" cy="12" r="3" fill="#C5AAF0" opacity="0.75">
      <animate attributeName="cy" values="13;10;13" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="11" r="1.8" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <text x="40" y="23.5"
        fill="#342C48"
        font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace"
        font-size="12.5"
        font-weight="700">under construction<tspan fill="#8B5FD3">.<animate attributeName="opacity" dur="2s" repeatCount="indefinite" calcMode="discrete" values="0;1;1;1;0" keyTimes="0;0.2;0.4;0.95;1"/></tspan><tspan fill="#8B5FD3">.<animate attributeName="opacity" dur="2s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.2;0.4;0.95;1"/></tspan><tspan fill="#8B5FD3">.<animate attributeName="opacity" dur="2s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;1"/></tspan></text>
</svg>
