<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1260 390"
     role="img"
     aria-labelledby="title desc">
  <title id="title">README Components</title>
  <desc id="desc">Adaptive README Components badge that changes text colors for light and dark themes.</desc>

  <defs>
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="42%" stop-color="#7C3AED"/>
      <stop offset="72%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="iconGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="48%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="componentsGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.7" flood-color="#000000" flood-opacity=".32"/>
    </filter>

    <style>
      :root {
        --text-main: #161B22;
        --text-detail: #394150;
        --inner-stroke: rgba(22, 27, 34, .20);
        --surface: rgba(255,255,255,.78);
        --surface-stroke: rgba(255,255,255,.95);
        --doc-lines: #394150;
        --separator: #6D28D9;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text-main: #F8FAFC;
          --text-detail: #D1D5DB;
          --inner-stroke: rgba(255,255,255,.24);
          --surface: rgba(8,12,20,.76);
          --surface-stroke: rgba(255,255,255,.28);
          --doc-lines: #E5E7EB;
          --separator: #22D3EE;
        }
      }

      .label-main {
        fill: var(--text-main);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -2px;
      }

      .label-sub {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        letter-spacing: -1px;
      }

      .doc-line {
        stroke: var(--doc-lines);
        stroke-width: 10;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- transparent background -->

  <!-- soft neon glow -->
  <rect x="45" y="38" width="1170" height="314" rx="78"
        fill="none" stroke="url(#borderGradient)" stroke-width="17"
        opacity=".28" filter="url(#softGlow)"/>

  <!-- adaptive glass-like surface -->
  <rect x="47" y="40" width="1166" height="310" rx="76"
        fill="var(--surface)" stroke="url(#borderGradient)" stroke-width="8"/>

  <rect x="63" y="56" width="1134" height="278" rx="62"
        fill="none" stroke="var(--surface-stroke)" stroke-width="2" opacity=".8"/>

  <rect x="70" y="63" width="1120" height="264" rx="56"
        fill="none" stroke="var(--inner-stroke)" stroke-width="2"/>

  <!-- Document icon -->
  <g transform="translate(125 83)">
    <path d="M54 25H180L228 73V222
             C228 237 217 248 202 248H54
             C39 248 28 237 28 222V51
             C28 36 39 25 54 25Z"
          fill="none" stroke="url(#iconGradient)" stroke-width="12"
          stroke-linejoin="round"/>

    <path d="M180 25V73H228"
          fill="none" stroke="url(#iconGradient)" stroke-width="12"
          stroke-linejoin="round"/>

    <line class="doc-line" x1="72" y1="103" x2="156" y2="103"/>
    <line class="doc-line" x1="72" y1="140" x2="120" y2="140"/>
    <line class="doc-line" x1="135" y1="140" x2="183" y2="140"/>
    <line class="doc-line" x1="72" y1="177" x2="139" y2="177"/>

    <!-- code brackets -->
    <g fill="none" stroke="#22D3EE" stroke-width="13"
       stroke-linecap="round" stroke-linejoin="round"
       filter="url(#softGlow)">
      <path d="M118 214L79 235L118 256"/>
      <path d="M171 214L210 235L171 256"/>
      <path d="M153 204L137 266"/>
    </g>
  </g>

  <!-- Separator -->
  <line x1="405" y1="108" x2="405" y2="282"
        stroke="url(#borderGradient)" stroke-width="5" stroke-linecap="round"
        filter="url(#softGlow)"/>

  <!-- Text -->
  <text class="label-main" x="455" y="225" font-size="96" filter="url(#textShadow)">README</text>
  <text class="label-sub" x="835" y="225" font-size="54" fill="url(#componentsGradient)">Components</text>
</svg>
